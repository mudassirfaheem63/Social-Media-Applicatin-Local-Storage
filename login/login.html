<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In • Social App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Background Decorations -->
  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <!-- Auth Container -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <div class="logo-circle">✨</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue your journey</p>
      </div>

      <!-- Form -->
      <form>
        <div class="input-group-custom">

          <div class="input-wrapper">
            <label for="email" class="input-label">
              <span class="label-icon">✉️</span> Email
            </label>
            <input type="email" id="email" class="form-control-custom" placeholder="you@example.com" />
          </div>

          <div class="input-wrapper">
            <label for="password" class="input-label">
              <span class="label-icon">🔒</span> Password
            </label>
            <input type="password" id="password" class="form-control-custom" placeholder="Min. 8 characters" />
          </div>

          <button type="submit" class="btn-submit">
            Sign In →
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <span>Don't have an account?</span>
        <a href="../signup/signup.html" class="auth-link">Sign up</a>
      </div>

    </div>
  </div>

  <!-- Loader -->
  <div>
    <img src="https://loading.io/assets/mod/spinner/default/lg.gif" alt="Loading..." />
  </div>

  <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • Social App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <!-- Background Decorations -->
  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <!-- Auth Container -->
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Header -->
      <div class="auth-header">
        <div class="logo-circle">✨</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join our community and start sharing</p>
      </div>

      <!-- Form -->
      <form>
        <div class="input-group-custom">
          <div class="input-row">
            <div class="input-wrapper">
              <label for="firstName" class="input-label">
                <span class="label-icon">👤</span> First Name
              </label>
              <input type="text" id="firstName" class="form-control-custom" placeholder="John" />
            </div>
            <div class="input-wrapper">
              <label for="lastName" class="input-label">
                <span class="label-icon">👤</span> Last Name
              </label>
              <input type="text" id="lastName" class="form-control-custom" placeholder="Doe" />
            </div>
          </div>

          <div class="input-wrapper">
            <label for="userName" class="input-label">
              <span class="label-icon">@</span> Username
            </label>
            <input type="text" id="userName" class="form-control-custom" placeholder="johndoe123" />
          </div>

          <div class="input-wrapper">
            <label for="email" class="input-label">
              <span class="label-icon">✉️</span> Email
            </label>
            <input type="email" id="email" class="form-control-custom" placeholder="john@example.com" />
          </div>

          <div class="input-wrapper">
            <label for="password" class="input-label">
              <span class="label-icon">🔒</span> Password
            </label>
            <input type="password" id="password" class="form-control-custom" placeholder="Min. 8 characters" />
          </div>

          <button type="submit" class="btn-submit">
            Create Account →
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="../login/login.html" class="auth-link">Sign in</a>
      </div>

    </div>
  </div>

  <!-- Loader -->
  <div>
    <img src="https://loading.io/assets/mod/spinner/default/lg.gif" alt="Loading..." />
  </div>

  <script src="signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Login</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <h1>Registration</h1>

    <form>
        <p>FirstName</p>
        <input id="firstName" type="text" placeholder="john">
        <p>LastName</p>
        <input id="lastName" type="text" placeholder="doe">
        <p>UserName</p>
        <input id="userName" type="text" placeholder="JD">
        <p>Email</p>
        <input id="email" type="email" placeholder="abc@gmail.com">
        <p>Password</p>
        <input id="password" type="password" placeholder="........">
        <br/>
        <button>submit</button>
    </form>
    <p style="text-align: center;">
        I have already an account <a href="../login/login.html"> Sign in </a>
    </p>
    <div>
        <img src="https://loading.io/assets/mod/spinner/default/lg.gif" alt="">
    </div>

    <script src="signup.js"></script>
</body>
</html>

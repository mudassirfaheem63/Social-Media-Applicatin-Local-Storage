<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile • Social App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">✨ SocialApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../home/home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Profile</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">More</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><a class="dropdown-item" href="#">Something else here</a></li>
            </ul>
          </li>
        </ul>

        <form class="d-flex me-3" onsubmit="event.preventDefault()">
          <input class="search-box" type="search" placeholder="Search..." />
        </form>

        <button class="btn-logout" onclick="logoutHandler()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-container">

    <!-- Profile Card -->
    <div class="card-custom profile-card">
      <img id="profilePicture" class="profile-avatar" src="" alt="Profile" />
      <h2 class="card-title"></h2>
      <div id="userName"></div>
      <div id="email"></div>
      <p class="card-text"></p>
      <button class="btn btn-edit" data-bs-toggle="modal" data-bs-target="#editModal">
        ✏️ Edit Profile
      </button>
    </div>

    <!-- User's Posts -->
    <h3 class="section-title">My Posts</h3>
    <div id="postArea"></div>

  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" id="inputFirstName" class="form-control form-control-custom" />
          </div>
          <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" id="inputLasttName" class="form-control form-control-custom" />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="inputDescription" class="form-control form-control-custom" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Profile Picture URL</label>
            <input type="text" id="inputProfilePicture" class="form-control form-control-custom" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary-custom" data-bs-dismiss="modal" onclick="saveHandler()">
            Save changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="personalprofile.js"></script>
</body>
</html>

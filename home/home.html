<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home • Social App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">✨ SocialApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="../home/home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../personalprofile/personalprofile.html">Profile</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">More</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><a class="dropdown-item" href="#">Something else here</a></li>
            </ul>
          </li>
        </ul>

        <form class="d-flex me-3" onsubmit="event.preventDefault()">
          <input class="search-box" type="search" placeholder="Search..." />
        </form>

        <button class="btn-logout" onclick="logoutHandler()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-container">

    <!-- Composer -->
    <div class="card-custom">
      <div class="composer-title">Create a post</div>
      <form onsubmit="event.preventDefault(); submitHandler();">
        <div class="mb-3">
          <textarea id="postCaption" class="form-control form-control-custom" rows="3" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="mb-3">
          <input type="text" id="postPictureURL" class="form-control form-control-custom" placeholder="Paste image URL..." />
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-primary-custom">Post</button>
        </div>
      </form>
    </div>

    <!-- Feed -->
    <h3 class="section-title">Your Feed</h3>
    <div id="postArea"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="home.js"></script>
</body>
</html>
